- id: r18
  title: "Смузі-миска з чорницею"
  emoji: 🫐
  age_from: 9
  time: "5 хв"
  products: [chornytsia, banan, yogurt, vivsianka]
  ingredients:
    - "Чорниця - жменя"
    - "Банан - половина"
    - "Натуральний йогурт - 3 ст. л."
    - "Мелені пластівці - 1 ст. л."
  steps:
    - "Все пробити блендером до густої маси."
    - "Викласти в мисочку, зверху додати кілька розчавлених ягід."
    - "Дати ложку - густа маса тримається на ложці краще за рідку."
  tips: "Смузі даємо ложкою з миски, а не в пляшці. Пиття калорій з трубочки не вчить жувати і псує зуби."
  freeze: "Не морозити."

# ─────────────── ДОДАНО: 6-8 МІС ───────────────

- id: r19
  title: "Пюре з кабачка і курки"
  emoji: 🍗
  age_from: 6
  time: "30 хв"
  products: [kurka, kabachok, oliia]
  ingredients:
    - "Куряче стегно без кістки і шкіри - 60 г"
    - "Кабачок - половина невеликого"
    - "Олія - 1 ч. л."
  steps:
    - "Курку залити холодною водою, довести до кипіння, першу воду злити."
    - "Залити свіжою водою, варити 25 хв до повної мʼякості."
    - "Кабачок почистити, додати до мʼяса за 8 хв до кінця."
    - "Пробити блендером з кількома ложками бульйону до густоти сметани."
    - "Вмішати олію в готове тепле пюре."
  tips: "Стегно ніжніше за грудку: у грудці менше жиру, тому пюре з неї виходить сухим і збивається в грудку."
  freeze: "Порційно в силіконовій формі до 3 місяців. Розігрівати на парі, курку не гріти двічі."

- id: r20
  title: "Гарбузове пюре з рисом"
