  products: [kvasolia, kabachok, pomidor, tsybulia, oliia]
  ingredients:
    - "Квасоля відварена - 150 г"
    - "Кабачок - 1 невеликий"
    - "Помідор - 1 шт."
    - "Цибуля - чверть"
    - "Олія - 1 ст. л."
  steps:
