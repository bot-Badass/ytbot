# Рецепти для прикорму. Без солі і цукру до року.
# age_from - з якого місяця страва доречна у цій подачі.

recipes:

- id: r01
  title: "Пюре з броколі та картоплі"
  emoji: 🥦
  age_from: 6
  time: "20 хв"
  products: [brokoli, kartoplia, oliia]
  ingredients:
    - "Броколі - 100 г (кілька суцвіть)"
    - "Картопля - 1 середня"
    - "Оливкова олія - 1 ч. л."
  steps:
    - "Картоплю почистити, порізати кубиками, варити 10 хв."
    - "Додати броколі, варити ще 7-8 хв до повної мʼякості (розминається пальцями)."
    - "Злити воду, лишивши півсклянки відвару."
    - "Пробити блендером, доводячи відваром до густоти сметани."
    - "Вмішати олію вже в готове, теплим."
  tips: "Густіше краще за рідше - рідке пюре стікає з ложки і дитина втомлюється раніше ніж наїсться."
  freeze: "Розкласти в силіконову форму для льоду, заморозити, пересипати в пакет. До 3 місяців. Розігрівати на парі або в мисці над окропом, не в мікрохвильовці - гріє нерівномірно."

- id: r02
  title: "Гречана каша з індичкою"
  emoji: 🥣
  age_from: 6
  time: "35 хв"
  products: [grechka, indychka, morkva, oliia]
  ingredients:
    - "Гречка - 3 ст. л."
    - "Філе стегна індички - 60 г"
    - "Морква - половина невеликої"
    - "Олія - 1 ч. л."
  steps:
    - "Індичку залити холодною водою, довести до кипіння, злити першу воду."
    - "Залити свіжою водою, варити 25 хв разом з морквою."
    - "Гречку відварити окремо до повного розварювання."
    - "Мʼясо подрібнити блендером з кількома ложками бульйону - має вийти вологе, не сухе."
    - "Змішати гречку, мʼясо, розім'яту моркву, влити олію."
  tips: "Головна помилка з мʼясом - подати сухим. Мʼясо завжди йде з бульйоном або підливою, інакше дитина його виплюне."
  freeze: "Заморожувати порційно. Мʼясо після розморозки стає сухішим - додати ложку бульйону при розігріві."

- id: r03
  title: "Батат смужками з духовки"
  emoji: 🍠
  age_from: 6
  time: "30 хв"
  products: [batat, oliia]
  ingredients:
    - "Батат - 1 середній"
    - "Олія - 1 ч. л."
  steps:
    - "Батат почистити, порізати смужками завтовшки з палець дорослого."
    - "Збризнути олією, викласти на пергамент."
    - "Запікати 25 хв при 190 °C до повної мʼякості."
    - "Перевірити: смужка має розчавлюватися між пальцями."
  tips: "Ідеальний перший продукт для BLW - форма під долоню, не сковзає, сама розтає в роті."
  freeze: "Заморожені смужки після розігріву стають мʼякшими - це навіть зручніше."

- id: r04
  title: "Омлет смужками"
  emoji: 🥚
  age_from: 6
  time: "10 хв"
  products: [yaitse, moloko, maslo]
  ingredients:
    - "Яйце - 1 шт."
    - "Молоко або грудне молоко - 1 ст. л."
    - "Вершкове масло для сковороди"
  steps:
    - "Яйце збити з молоком до однорідності."
    - "Розігріти сковороду на середньому вогні, розтопити масло."
    - "Вилити суміш, накрити кришкою, смажити 3-4 хв до повного схоплення - без рідких місць."
    - "Перекласти на дошку, порізати смужками шириною з палець."
  tips: "До 5 років яйце має бути проварене повністю. Рідкий жовток - ризик сальмонели."
  freeze: "Не морозити, готується за 10 хвилин."

- id: r05
  title: "Вівсянка на грудному молоці"
  emoji: 🥣
  age_from: 6
  time: "12 хв"
  products: [vivsianka, banan, maslo]
  ingredients:
    - "Вівсяні пластівці (не швидкорозчинні) - 3 ст. л."
    - "Вода - 100 мл"
    - "Грудне молоко або суміш - 50 мл"
    - "Банан - половинка"
  steps:
    - "Пластівці залити водою, варити 7-8 хв на малому вогні, помішуючи."
    - "Зняти з вогню, дати охолонути до теплого."
    - "Вмішати грудне молоко або суміш - тільки в остиглу кашу, щоб не згорнулося."
    - "Банан розім'яти виделкою і вмішати."
  tips: "Каша має триматися на перевернутій ложці. Рідка каша - головна причина, чому дитина не наїдається зі сніданку."
  freeze: "Кашу морозити можна, але простіше варити свіжу."

- id: r06
  title: "Суп-пюре з червоної сочевиці"
  emoji: 🍲
  age_from: 6
  time: "30 хв"
  products: [sochevytsia, morkva, batat, oliia]
  ingredients:
    - "Червона сочевиця - 4 ст. л."
    - "Морква - 1 невелика"
    - "Батат або картопля - 1 шт."
    - "Олія - 1 ч. л."
  steps:
    - "Сочевицю промити до прозорої води."
    - "Овочі порізати кубиками, залити водою на 2 пальці вище."
    - "Варити 15 хв, додати сочевицю, варити ще 12-15 хв - вона має повністю розваритися."
    - "Пробити блендером, влити олію."
  tips: "Червона сочевиця розварюється в пюре сама і не потребує замочування. Вітамін C з моркви і батату допомагає засвоїти залізо сочевиці."
  freeze: "Морозиться відмінно. Після розморозки густішає - розвести окропом."

- id: r07
  title: "Тефтелі з індички в підливі"
  emoji: 🍖
  age_from: 9
  time: "35 хв"
  products: [indychka, vivsianka, tsybulia, oliia]
  ingredients:
    - "Фарш з індички - 200 г"
    - "Вівсяні пластівці мелені - 2 ст. л."
    - "Цибуля - чверть невеликої"
    - "Вода або бульйон - 150 мл"
  steps:
    - "Цибулю дрібно натерти, змішати з фаршем і меленими пластівцями."
    - "Скачати кульки завбільшки з волоський горіх."
    - "Викласти в сотейник, залити водою або бульйоном до половини висоти."
    - "Тушкувати під кришкою 20-25 хв на малому вогні."
  tips: "Пластівці замість хліба - тефтеля стає мʼякшою і не розпадається. Подавати обовʼязково з підливою."
  freeze: "Морозити готовими разом з підливою, порційно. До 2 місяців."

- id: r08
  title: "Рибні котлетки з тріски"
  emoji: 🐠
  age_from: 9
  time: "25 хв"
  products: [triska, kartoplia, yaitse, oliia]
  ingredients:
    - "Філе тріски або хека - 200 г"
    - "Картопля варена - 1 шт."
    - "Яйце - половина"
    - "Олія для смаження"
  steps:
    - "Філе перевірити на кістки руками, потім ще раз проти світла."
    - "Подрібнити ножем або блендером в імпульсному режимі, не в кашу."
    - "Змішати з розім'ятою картоплею і яйцем."
    - "Сформувати невеликі котлетки, обсмажити по 3-4 хв з кожного боку, довести під кришкою 5 хв."
  tips: "Риба - топ-алерген. Перший раз давати зранку, невелику порцію, окремо від інших нових продуктів, і спостерігати два дні."
  freeze: "Морозити сирими напівфабрикатами між шарами пергаменту."

- id: r09
  title: "Паштет з курячої печінки"
  emoji: 🫀
  age_from: 6
  time: "25 хв"
  products: [pechinka, morkva, maslo]
  ingredients:
    - "Куряча печінка - 150 г"
    - "Морква - 1 невелика"
    - "Вершкове масло - 15 г"
  steps:
    - "Печінку промити, зрізати плівки і протоки."
    - "Залити водою разом з морквою, варити 15 хв від закипання."
    - "Злити, дати трохи охолонути."
    - "Пробити блендером з морквою і маслом, доводячи відваром до консистенції густої сметани."
  tips: "Найщільніше джерело заліза у прикормі. Через високий вітамін A - не частіше 1-2 разів на тиждень. Морква прибирає специфічний присмак."
  freeze: "Порційно в формі для льоду. До 2 місяців."

- id: r10
  title: "Хумус без солі"
  emoji: 🫘
  age_from: 9
  time: "15 хв (нут відварений)"
  products: [nut, tahini, oliia]
  ingredients:
    - "Нут відварений - 200 г"
    - "Тахіні - 1 ст. л."
    - "Олія оливкова - 1 ст. л."
    - "Вода або відвар - 3-4 ст. л."
  steps:
    - "Нут відварити до повної мʼякості (з банки - промити)."
    - "Пробити блендером з тахіні і олією."
    - "Доводити водою до гладкої пасти, без грудок."
  tips: "Найзручніший спосіб ввести кунжут. Мазати тонким шаром на тост - густа ложка пасти залипає в горлі."
  freeze: "Морозиться, після розморозки перемішати."

- id: r11
  title: "Вівсяні оладки без цукру"
  emoji: 🥞
  age_from: 9
  time: "20 хв"
  products: [vivsianka, banan, yaitse, maslo]
  ingredients:
    - "Вівсяні пластівці мелені - 5 ст. л."
    - "Банан стиглий - 1 шт."
    - "Яйце - 1 шт."
    - "Масло для сковороди"
  steps:
    - "Банан розім'яти виделкою до пюре."
    - "Вмішати яйце і мелені пластівці, дати постояти 10 хв щоб набубнявіло."
    - "Смажити на малому вогні під кришкою по 3 хв з кожного боку."
    - "Порізати смужками."
  tips: "Банан замінює і цукор, і зв'язуючий компонент. Солодощі не потрібні."
  freeze: "Морозити стопкою через пергамент. Розігрівати на сухій сковороді."

- id: r12
  title: "Сирники на вівсяному борошні"
  emoji: 🧀
  age_from: 9
  time: "25 хв"
  products: [syr_kyslo, yaitse, vivsianka, maslo]
  ingredients:
    - "Кисломолочний сир - 200 г"
    - "Яйце - 1 шт."
    - "Вівсяне борошно - 3 ст. л."
    - "Масло для сковороди"
  steps:
    - "Сир протерти через сито або пробити блендером - без крупинок."
    - "Змішати з яйцем і борошном."
    - "Сформувати невисокі сирники, обсмажити по 3 хв з боку."
    - "Довести під кришкою 5 хв на малому вогні."
  tips: "Різати смужками, а не кубиками - смужку дитині зручніше тримати."
  freeze: "Морозити готовими, розігрівати в духовці."

- id: r13
  title: "Паста з броколі і сиром"
  emoji: 🍝
  age_from: 9
  time: "20 хв"
  products: [makarony, brokoli, syr_tverdyi, oliia]
  ingredients:
    - "Макарони великих форм - 60 г"
    - "Броколі - 80 г"
    - "Твердий сир тертий - 1 ст. л."
    - "Олія - 1 ч. л."
  steps:
    - "Макарони варити на 2-3 хв довше ніж написано на пачці."
    - "За 5 хв до кінця кинути в ту саму воду броколі."
    - "Злити, лишивши трохи води."
    - "Заправити олією, посипати тертим сиром, розмішати з ложкою води від варіння."
  tips: "Al dente для дитини не підходить - пружні макарони сковзають і не жуються. Розварюємо сильніше."
  freeze: "Не морозити, готується швидше ніж розморожується."

- id: r14
  title: "Запечений лосось з овочами"
  emoji: 🐟
  age_from: 6
  time: "25 хв"
  products: [losos, kabachok, kartoplia, oliia]
  ingredients:
    - "Філе лосося - 120 г"
    - "Кабачок - половина"
    - "Картопля - 1 шт."
    - "Олія - 1 ч. л."
  steps:
    - "Картоплю нарізати тонкими скибками, викласти на пергамент, збризнути олією."
    - "Запікати 12 хв при 190 °C."
    - "Додати кабачок і рибу зверху, запікати ще 12-14 хв."
    - "Рибу розібрати руками на пластівці, перевіряючи кістки."
  tips: "Пальцями кістки шукаються надійніше ніж очима. Пройтися по всьому шматку двічі."
  freeze: "Готову рибу морозити не варто - стає сухою і волокнистою."

- id: r15
  title: "Печене яблуко з корицею"
  emoji: 🍎
  age_from: 6
  time: "25 хв"
  products: [yabluko, maslo]
  ingredients:
    - "Яблуко - 1 шт."
    - "Вершкове масло - 5 г"
    - "Кориця - на кінчику ножа"
  steps:
    - "Яблуко розрізати навпіл, вийняти серцевину."
    - "Покласти в кожну половинку шматочок масла, притрусити корицею."
    - "Запікати 20 хв при 180 °C до повної мʼякості."
    - "Мʼякоть вибрати ложкою або подати смужками без шкірки."
  tips: "Сире яблуко до року не давати - воно тверде і є однією з найчастіших причин задухи. Печене вирішує питання повністю."
  freeze: "Мʼякоть морозити порційно."

- id: r16
  title: "Мамалига брусочками"
  emoji: 🌽
  age_from: 9
  time: "25 хв"
  products: [kukurudziana, syr_tverdyi, maslo]
  ingredients:
    - "Кукурудзяна крупа - 100 г"
    - "Вода - 400 мл"
    - "Масло - 10 г"
    - "Тертий сир - 1 ст. л."
  steps:
    - "Крупу всипати в киплячу воду тонкою цівкою, безперервно помішуючи."
    - "Варити 20 хв на малому вогні, часто мішаючи."
    - "Вмішати масло і сир, викласти в форму шаром 2 см."
    - "Дати застигнути, порізати брусочками."
  tips: "Застигла мамалига тримає форму - дитина бере її як паличку. Зручніше за кашу для самостійної їжі."
  freeze: "Морозити брусочками, розігрівати на сухій сковороді."

- id: r17
  title: "Овочеве рагу з квасолею"
  emoji: 🍲
  age_from: 12
  time: "35 хв"
  products: [kvasolia, kabachok, pomidor, tsybulia, oliia]
  ingredients:
    - "Квасоля відварена - 150 г"
    - "Кабачок - 1 невеликий"
    - "Помідор - 1 шт."
    - "Цибуля - чверть"
    - "Олія - 1 ст. л."
  steps:
    - "Цибулю припустити на олії до прозорості."
    - "Додати кубики кабачка, тушкувати 8 хв."
    - "Додати помідор без шкірки, тушкувати ще 10 хв."
    - "Вкинути квасолю, прогріти 5 хв під кришкою."
  tips: "Сіль додаємо тільки собі в тарілку. Дитяча порція йде з тієї самої каструлі до досолювання."
  freeze: "Морозиться добре, до 3 місяців."

- id: r18
  title: "Смузі-миска з чорницею"
  emoji: 🫐
  age_from: 9
  time: "5 хв"
  products: [chornytsia, banan, yogurt, vivsianka]
  ingredients:
    - "Чорниця - жменя"
    - "Банан - половина"
    - "Натуральний йогурт - 3 ст. л."
    - "Мелені пластівці - 1 ст. л."
  steps:
    - "Все пробити блендером до густої маси."
    - "Викласти в мисочку, зверху додати кілька розчавлених ягід."
    - "Дати ложку - густа маса тримається на ложці краще за рідку."
  tips: "Смузі даємо ложкою з миски, а не в пляшці. Пиття калорій з трубочки не вчить жувати і псує зуби."
  freeze: "Не морозити."
