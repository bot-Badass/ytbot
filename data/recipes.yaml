  age_from: 6
  time: "25 хв"
  products: [garbuz, rys, maslo]
  ingredients:
    - "Гарбуз - 150 г мʼякоті"
    - "Рис - 2 ст. л."
    - "Вершкове масло - 1 ч. л."
  steps:
