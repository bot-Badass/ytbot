# Ідеї збалансованих тарілок за віком.
# Принцип: овоч або фрукт + вуглевод + білок + жир. Жир додаємо завжди -
# без нього не засвояться вітаміни A, D, E, K, а обʼєм шлунка малий.
# age: m6 (6-8 міс) | m9 (9-11 міс) | m12 (12 міс+)

plates:

# ─────────── 6-8 місяців: пюре і мʼякі палички ───────────

- id: p01
  age: m6
  title: "Гарбуз, гречка, індичка"
  items: [garbuz, grechka, indychka, oliia]
  note: "Класичний старт. Гречка дає залізо, індичка гемове залізо, гарбуз - смак і бета-каротин."

- id: p02
  age: m6
  title: "Броколі, картопля, лосось"
  items: [brokoli, kartoplia, losos, oliia]
  note: "Перша риба. Подавати зранку, окремо від інших нових продуктів."

- id: p03
  age: m6
  title: "Батат, червона сочевиця, авокадо"
  items: [batat, sochevytsia, avokado]
  note: "Без мʼяса, але залізо є. Вітамін C з батату допомагає засвоїти залізо сочевиці."

- id: p04
  age: m6
  title: "Кабачок, вівсянка, жовток"
  items: [kabachok, vivsianka, yaitse, maslo]
  note: "Мʼякий старт з введенням яйця. Яйце - топ-алерген, давати повністю проварене."

- id: p05
  age: m6
  title: "Цвітна капуста, рис, курка"
  items: [tsvitna, rys, kurka, oliia]
  note: "Найнейтральніший смак з усіх - для дітей, які вередують."

- id: p06
  age: m6
  title: "Морква, кіноа, яловичина"
  items: [morkva, kinoa, yalovychyna, oliia]
  note: "Найбільше заліза серед усіх тарілок для 6 місяців."

- id: p07
  age: m6
  title: "Груша, вівсянка, йогурт"
  items: [grusha, vivsianka, yogurt]
  note: "Сніданок. Йогурт вводить молочний білок, груша мʼяко послаблює."

- id: p08
  age: m6
  title: "Тост з арахісовою пастою і банан"
  items: [khlib, arakhis, banan]
  note: "Введення арахісу. Пасту розводити або мазати дуже тонко. Тільки зранку і окремо."

- id: p09
  age: m6
  title: "Гарбуз, пшоно, печінка"
  items: [garbuz, psheno, pechinka, maslo]
  note: "Ударна доза заліза. Печінку не частіше 1-2 разів на тиждень."

- id: p10
  age: m6
  title: "Стручкова квасоля, картопля, тріска"
  items: [kvasolia_struch, kartoplia, triska, oliia]
  note: "Легка рибна тарілка. Кістки перевірити двічі."

- id: p11
  age: m6
  title: "Яблуко печене, кисломолочний сир"
  items: [yabluko, syr_kyslo, maslo]
  note: "Підвечірок. Сире яблуко у цьому віці не давати."

- id: p12
  age: m6
  title: "Буряк, гречка, кролик"
  items: [buriak, grechka, krolyk, oliia]
  note: "Не щодня - буряк дає нітратне навантаження. Кал може стати рожевим."

# ─────────── 9-11 місяців: шматочки і пальчикова їжа ───────────

- id: p21
  age: m9
  title: "Макарони, помідор, яловичина"
  items: [makarony, pomidor, yalovychyna, syr_tverdyi]
  note: "Перша паста. Макарони розварити довше ніж для дорослих, сир натерти зверху."

- id: p22
  age: m9
  title: "Омлет, авокадо, тост"
  items: [yaitse, avokado, khlib, syr_tverdyi]
  note: "Сніданок руками. Омлет різати смужками з палець, авокадо кубиками."

- id: p23
  age: m9
  title: "Тефтелі з індички, батат, броколі"
  items: [indychka, batat, brokoli, oliia]
  note: "Тефтелька - зручний розмір для пінцетного захвату. Обовʼязково з підливою."

- id: p24
  age: m9
  title: "Хумус, огірок, тост"
  items: [nut, tahini, ogirok, khlib]
  note: "Кунжут через тахіні в хумусі. Огірок без шкірки смужками."

- id: p25
  age: m9
  title: "Гречка, печінковий паштет, морква"
  items: [grechka, pechinka, morkva, maslo]
  note: "Паштет тонким шаром. Морква розварена кубиками, не кружальцями."

- id: p26
  age: m9
  title: "Рибні котлетки, кіноа, зелений горошок"
  items: [triska, kinoa, goroshok, oliia]
  note: "Горошок уже можна цілим, якщо дитина впевнено жує."

- id: p27
  age: m9
  title: "Вівсяні оладки, чорниця, йогурт"
  items: [vivsianka, chornytsia, yogurt]
  note: "Оладки смужками. Чорницю розчавити або розрізати навпіл."

- id: p28
  age: m9
  title: "Сочевичний суп, хліб, твердий сир"
  items: [sochevytsia, morkva, khlib, syr_tverdyi]
  note: "Густий суп ложкою, хліб підсушений смужками для вмочування."

- id: p29
  age: m9
  title: "Курка, рис, кабачок"
  items: [kurka, rys, kabachok, oliia]
  note: "Стегно замість грудки - соковитіше. Рис не робити щоденним."

- id: p30
  age: m9
  title: "Сирники, груша, вершкове масло"
  items: [syr_kyslo, grusha, maslo, vivsianka]
  note: "Сирники на вівсяному борошні, без цукру. Різати смужками."

# ─────────── 12 місяців і старше: сімейний стіл ───────────

- id: p41
  age: m12
  title: "Запечений лосось, картопля, салат з огірка"
  items: [losos, kartoplia, ogirok, oliia]
  note: "Практично доросла тарілка. Сіль додаємо собі в тарілку, не в спільну каструлю."

- id: p42
  age: m12
  title: "Плов з яловичиною і морквою"
  items: [rys, yalovychyna, morkva, tsybulia]
  note: "Без гострих спецій. Дитині - порція без солі."

- id: p43
  age: m12
  title: "Паста з броколі і твердим сиром"
  items: [makarony, brokoli, syr_tverdyi, oliia]
  note: "Сир брати менш солоний. Броколі мʼякі суцвіття."

- id: p44
  age: m12
  title: "Омлет з помідором, тост, молоко"
  items: [yaitse, pomidor, khlib, moloko]
  note: "Молоко з чашки вже можна як напій - до 400 мл на день сумарно."

- id: p45
  age: m12
  title: "Котлети з індички, кіноа, стручкова квасоля"
  items: [indychka, kinoa, kvasolia_struch, oliia]
  note: "Котлети різати на 4 частини, не давати цілою."

- id: p46
  age: m12
  title: "Овочеве рагу з квасолею і хлібом"
  items: [kvasolia, kabachok, pomidor, khlib]
  note: "Квасоля вже може бути цілою, якщо добре розварена."

- id: p47
  age: m12
  title: "Каша вівсяна з малиною і горіховим борошном"
  items: [vivsianka, malyna, gorikhy, maslo]
  note: "Горіхи тільки мелені в борошно. Цілі - не раніше 4-5 років."

- id: p48
  age: m12
  title: "Гуляш зі свинини, гречка, буряковий салат"
  items: [svynyna, grechka, buriak, oliia]
  note: "Буряк тертий з олією. Мʼясо січемо впоперек волокон."
