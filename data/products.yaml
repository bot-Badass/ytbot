# Бібліотека продуктів для прикорму.
# group: veg овочі | fruit фрукти | grain крупи | protein білок | dairy молочні | fat жири | other інше
# choking: low | med | high - ризик подавитися при неправильній подачі
# allergen: порожньо або назва групи алергенів (вводити рано і регулярно, не відкладати)
# Джерела підходу: ВООЗ, AAP, EFSA, Solid Starts. Це довідка, не медичне призначення.

products:

# ─────────────── ОВОЧІ ───────────────

- code: brokoli
  name: Броколі
  emoji: 🥦
  group: veg
  style: main
  from_month: 6
  choking: med
  serve:
    m6: "Велике суцвіття з ніжкою-ручкою, зварене на парі до повної мʼякості (розминається пальцями). Дитина тримає за ніжку і обсмоктує верхівку."
    m9: "Дрібні суцвіття 1-1.5 см, добре розварені. Можна вже без ніжки."
    m12: "Соцвіття будь-якого розміру, мʼякі. Підходить запечена, у супі, в омлеті."
  benefit: "Вітамін C, вітамін K, фолати, клітковина."
  caution: "Тверді сирі суцвіття не давати - ризик подавитися. Може давати гази перші кілька разів."

- code: tsvitna
  name: Цвітна капуста
  emoji: 🥬
  group: veg
  style: main
  from_month: 6
  choking: med
  serve:
    m6: "Велике суцвіття, парене до мʼякості, як ручка. Або пюре з краплею олії."
    m9: "Суцвіття 1-1.5 см або розім'яте виделкою."
    m12: "Запечена, у рагу, шматочками з сімейного столу."
  benefit: "Вітамін C, холін, клітковина. Ніжна на смак, добре заходить першою."
  caution: "Сира тверда - ризик подавитися."

- code: kabachok
  name: Кабачок
  emoji: 🥒
  group: veg
  style: main
  from_month: 6
  choking: low
  serve:
    m6: "Смужки з палець дорослого, зварені або запечені до мʼякості. Шкірку зняти."
    m9: "Кубики 1-1.5 см, мʼякі. Шкірку вже можна лишати, якщо тонка."
    m12: "Будь-яка форма: оладки, рагу, запіканка."
  benefit: "Легко засвоюється, мало алергенний. Класичний стартовий овоч."
  caution: ""

- code: garbuz
  name: Гарбуз
  emoji: 🎃
  group: veg
  style: both
  from_month: 6
  choking: low
  serve:
    m6: "Смужки завдовжки з палець, запечені до мʼякості, або густе пюре з олією."
    m9: "Кубики 1-1.5 см, мʼякі."
    m12: "Запечений скибками, у каші, у супі-пюре."
  benefit: "Бета-каротин (вітамін A), калій, клітковина. Природно солодкий."
  caution: "Багато гарбуза підряд може дати помаранчевий відтінок шкіри - це безпечно і минає."

- code: morkva
  name: Морква
  emoji: 🥕
  group: veg
  style: main
  from_month: 6
  choking: high
  serve:
    m6: "Тільки добре розварена: паличка з палець або пюре. Сира тверда морква заборонена."
    m9: "Розварені кубики 1-1.5 см або тертa на дрібну тертку сира в складі страви."
    m12: "Мʼякі шматочки. Сиру паличку - не раніше 3-4 років."
  benefit: "Бета-каротин, клітковина."
  caution: "Одна з головних причин задухи у малюків. Кружальця не давати ніколи - тільки поздовжні палички або кубики. Нітрати: не давати щодня великими порціями до року."

- code: kartoplia
  name: Картопля
  emoji: 🥔
  group: veg
  style: main
  from_month: 6
  choking: low
  serve:
    m6: "Варена, розім'ята з краплею олії або грудного молока. Або паличка вареної картоплі."
    m9: "Кубики 1-1.5 см, мʼякі."
    m12: "Пюре, запечена, у супі."
  benefit: "Калій, вітамін C, енергія."
  caution: "Зелені ділянки і паростки зрізати. Смажену і фрі - ні."

- code: batat
  name: Батат
  emoji: 🍠
  group: veg
  style: both
  from_month: 6
  choking: low
  serve:
    m6: "Смужки з палець, запечені до мʼякості. Дуже зручний перший продукт для руки."
    m9: "Кубики 1-1.5 см."
    m12: "Запечений, пюре, у млинцях."
  benefit: "Бета-каротин, калій, клітковина, повільні вуглеводи."
  caution: ""

- code: buriak
  name: Буряк
  emoji: 🫐
  group: veg
  style: main
  from_month: 6
  choking: low
  serve:
    m6: "Варений до мʼякості, смужками або пюре. Змішувати з іншим овочем - смак яскравий."
    m9: "Кубики 1-1.5 см."
    m12: "Варений, запечений, у салаті натертий."
  benefit: "Фолати, залізо, нітрати корисні для судин у дорослих."
  caution: "Високий вміст нітратів - не щодня і не великими порціями до року. Готову страву не зберігати довго при кімнатній температурі. Може забарвити кал і сечу в рожеве - це не кров."

- code: goroshok
  name: Зелений горошок
  emoji: 🟢
  group: veg
  style: main
  from_month: 6
  choking: high
  serve:
    m6: "Розім'ятий виделкою або пюре. Цілу горошину не давати."
    m9: "Можна цілі мʼякі горошини, якщо дитина впевнено жує - або розчавлені пальцями."
    m12: "Цілі, добре зварені."
  benefit: "Рослинний білок, залізо, клітковина."
  caution: "Ціла горошина у 6-8 міс - ризик задухи. Розчавлюйте."

- code: kvasolia_struch
  name: Стручкова квасоля
  emoji: 🫛
  group: veg
  style: main
  from_month: 6
  choking: med
  serve:
    m6: "Цілий стручок, розварений до повної мʼякості - дитина обсмоктує."
    m9: "Порізана на шматочки 1 см, мʼяка."
    m12: "Шматочками, у рагу, на парі."
  benefit: "Клітковина, фолати, вітамін K."
  caution: "Недоварена квасоля пружна і слизька - ризик подавитися."

- code: pomidor
  name: Помідор
  emoji: 🍅
  group: veg
  style: main
  from_month: 6
  choking: high
  serve:
    m6: "Тушкований без шкірки, розім'ятий. Або велика мʼяка часточка, з якої дитина смокче сік."
    m9: "Черрі різати вздовж на 4 частини. Шкірку краще зняти."
    m12: "Часточки, у салаті, тушкований. Черрі і далі різати на 4."
  benefit: "Лікопін, вітамін C, калій."
  caution: "Цілий черрі - класична причина задухи, різати ТІЛЬКИ вздовж на чотири. Кислота може подразнити шкіру навколо рота - це контактне подразнення, не алергія."

- code: ogirok
  name: Огірок
  emoji: 🥒
  group: veg
  style: both
  from_month: 6
  choking: high
  serve:
    m6: "Великий охолоджений огірок цілим шматком у руку - для сверблячих ясен. Дитина обсмоктує, не відкушує."
    m9: "Без шкірки, тонкі мʼякі смужки або тертий."
    m12: "Смужки і кубики без шкірки. Товсті кружальця - ні."
  benefit: "Вода, свіжість, полегшує прорізування зубів."
  caution: "Сирий огірок твердий - тільки смужками, не кружальцями. Шкірку до року знімати."

- code: shpynat
  name: Шпинат
  emoji: 🥬
  group: veg
  style: main
  from_month: 6
  choking: med
  serve:
    m6: "Тушкований і дрібно посічений у складі пюре чи каші. Окремо листок не давати."
    m9: "Дрібно посічений у страві, в омлеті, у сирниках."
    m12: "У стравах, у смузі, тушкований."
  benefit: "Залізо (краще засвоюється з вітаміном C), фолати, вітамін K."
  caution: "Високі нітрати і оксалати - не щодня. Цілий листок липне до піднебіння, завжди січемо."

- code: tsybulia
  name: Цибуля і часник
  emoji: 🧅
  group: veg
  style: main
  from_month: 6
  choking: low
  serve:
    m6: "Тільки в складі страви, добре протушкована, для смаку."
    m9: "Дрібно посічена у страві."
    m12: "У стравах, злегка припущена."
  benefit: "Смак без солі - головна причина додавати. Пребіотики."
  caution: "Сиру не давати. Багато часнику може змінити смак грудного молока."

