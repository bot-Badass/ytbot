  manna: "Густа каша на воді, грудному молоці чи суміші. Почати з 1-2 ч. л., чергувати з гречкою і вівсянкою."
  bulhur: "Дрібний булгур розварити довше, ніж пише упаковка, і пробити з овочами. Почати з 1-2 ч. л."
  kuskus: "Запарити вологим і змішати з овочевим пюре чи олією. Почати з 1-2 ч. л., сухим не давати."
  perlivka: "Варити щонайменше годину і пробити в пюре чи суп. Почати з 1-2 ч. л."
  yachna: "Добре розварити вʼязку кашу і пробити блендером. Почати з 1-2 ч. л."
  polba: "Добре розварена каша на воді, пробита до гладкості. Почати з 1-2 ч. л., глютен тут є."
  amarant: "Розварена вʼязка каша на воді, добре розмішати, можна з фруктовим пюре."
  rys_loksh: "Розварити до мʼякості, порізати дрібно і пробити з овочами. З 9 міс - шматочки до 1 см у пюре."
  rys_buryi: "Промити, дуже добре розварити і пробити в пюре. Чергувати з іншими крупами."
  zhytni: "Розварені пластівці пробити блендером на воді чи суміші. Почати з 1-2 ч. л."
  pshenychna: "Добре розварена густа каша, пробита блендером. Почати з 1-2 ч. л., далі давати регулярно."
  pita: "Підсушену піту розмочити в грудному молоці чи пюре і розімʼяти. Почати з невеликого шматочка."
  pechyvo: "З 7 місяців, зрідка: розмочити в молоці і розімʼяти в кашу. Брати без доданого цукру, почати з шматочка."
  multizlak: "З 8 місяців, коли кожна крупа вже була окремо: густа каша на воді чи суміші, без цукру."
  telyatyna: "Довго тушкувати до волокон і пробити з бульйоном чи олією. З 9 міс - дрібний фарш з підливою."
  baranyna: "Зрізати жир, довго тушкувати і пробити з овочами. З 9 міс - дрібно посікти з підливою."
  kachka: "З 8 місяців: мʼясо без шкіри і жиру протушкувати і пробити з овочами."
  huska: "До 10 місяців не давати: надто жирне мʼясо. Потім зрідка, без шкіри і жиру, пробити з овочами."
  perepilka: "Мʼясо зняти з кісток до останньої, перебрати руками і пробити з овочевим пюре."
  pechinka_y: "Відварити і пробити в пюре з овочем, порція 1 ч. л. Не частіше 1-2 разів на тиждень."
  sertse: "З 8 місяців: довго тушкувати до мʼякості і пробити з овочами чи бульйоном."
  yazyk: "З 8 місяців: зварити, зняти шкірку і пробити з овочевим пюре."
  miaso_pure: "1-2 ч. л. вмішати в овочеве пюре чи кашу. Склад без солі і крохмалю, відкриту баночку зберігати добу."
  kovbasa: "Не давати."
  skumbriia: "Свіжу запекти, перебрати пальцями на кістки і розімʼяти з картоплею чи олією. Почати з 1 ч. л., копчену не давати."
  oseledets: "До 12 місяців не давати."
  sardyna: "Свіжу запекти і перебрати від кісток, консерву у власному соку промити. Розімʼяти з пюре, почати з 1 ч. л."
  tunets: "З 8 місяців, не частіше разу на тиждень: розімʼяти з пюре чи олією, перевірити на кістки. Почати з 1 ч. л."
  forel: "Запекти, перебрати пальцями на кістки і розімʼяти з олією чи пюре. Почати з 1 ч. л. зранку."
  sudak: "Відварити, перебрати від кісток і пробити з овочевим пюре. Почати з 1 ч. л. зранку."
  kambala: "Філе на парі двічі перевірити на кістки і розімʼяти з картоплею. Почати з 1 ч. л. зранку."
  korop: "З 8 місяців: філе ретельно перебрати від дрібних кісток або перекрутити і пробити з пюре. Почати з 1 ч. л."
  shchuka: "З 8 місяців: перебрати від кісток, перекрутити і пробити з підливою чи пюре. Почати з 1 ч. л."
  paltus: "З 8 місяців, не частіше разу на тиждень: запекти, перевірити на кістки і розімʼяти з пюре. Почати з 1 ч. л."
  moiva: "З 8 місяців: запекти, прибрати хребет і кістки, розімʼяти з пюре. Почати з 1 ч. л."
  dorado: "Запекти, перебрати пальцями на кістки і розімʼяти з олією. Почати з 1 ч. л. зранку."
  krevetky: "Відварити, дрібно посікти і пробити в овочеве пюре. Почати з 1 ч. л. зранку вдома."
  midii: "З 9 місяців: свіжі, повністю проварені і розкриті, дрібно посікти в пюре. Почати з 1 ч. л."
  kalmar: "До 12 місяців не давати."
  ikra: "Не давати."
  krab_paly: "Не давати."
  yaitse_per: "Тільки зварене круто, розімʼяти з олією чи овочевим пюре. Почати з 1 ч. л."
  horokh: "З 7 місяців: замочити на ніч, розварити і пробити в суп-пюре. Почати з невеликої порції."
  edamame: "Вилущені боби зварити до мʼякості, зняти шкірку і пробити в пюре. Почати з 1 ч. л."
  tofu: "Мʼякий тофу розімʼяти з олією і овочевим пюре. Вводити окремим днем, почати з 1 ч. л."
  mash: "З 7 місяців: замочити, розварити і пробити в пюре чи суп. Почати з невеликої порції."
  khumus: "Домашній без солі розвести водою до мʼякого пюре або вмішати в овочі. Почати з 1 ч. л."
  bob: "З 8 місяців: зняти шкірку з кожного боба, розварити і пробити в пюре."
  riazhanka: "З 8 місяців: без цукру і наповнювачів, почати з 1-2 ч. л. ложкою чи в кашу."
  smetana: "З 8 місяців: 1 ч. л. як заправка в овочеве пюре."
  vershky: "З 8 місяців: 1 ч. л. в овочеве пюре чи кашу як заправка, без цукру."
  bryndza: "До 12 місяців не давати."
  mozarela: "Натерти дрібно і розплавити в гарячому пюре чи каші. Почати з дрібки, кульками не давати."
  plavlenyi: "Не давати."
  tvorozhok: "З 8 місяців лише без цукру і наповнювача. Краще чистий кисломолочний сир з фруктовим пюре."
  koz_moloko: "До 12 місяців як напій не давати."
  koz_syr: "З 8 місяців: молодий мʼякий з пастеризованого молока розімʼяти в пюре. Почати з 1 ч. л."
  rosl_moloko: "Не давати як заміну грудному молоку чи суміші. Рисове не давати."
  maslianka: "З 8 місяців: почати з 1-2 ч. л., краще змішати з фруктовим пюре."
  lliana_ol: "Додати пів ч. л. у готове охолоджене пюре. Не нагрівати."
  kokos_ol: "Додати пів ч. л. у готове пюре чи кашу, чергувати з іншими оліями."
  harb_nasin: "Тільки змелене в борошно: 1 ч. л. вмішати в кашу чи пюре. Ціле насіння не давати."
  son_nasin: "Тільки змелене в борошно: 1 ч. л. вмішати в кашу чи пюре. Смажене солоне не давати."
  chia: "Замочити 1 ч. л. у 3 ложках рідини на 15 хв і вмішати в кашу чи пюре. Сухим не давати."
  lyon: "Змолоти перед вживанням, 1 ч. л. вмішати в кашу чи пюре."
  mygdal_pas: "Розвести водою чи молоком до рідкого і вмішати в кашу. Почати з 1/4 ч. л. зранку, густою не давати."
  kesh_pasta: "Розвести до рідкого і вмішати в кашу чи пюре. Почати з кінчика ложки зранку вдома, густою не давати."
  olyvky: "До 12 місяців не давати."
  smalets: "До 12 місяців не давати."
  kokos_mol: "Додати 1 ложку в кашу чи овочеве пюре замість олії. Без цукру і загусників."
  mayonez: "Не давати."
  bulion: "З 8 місяців: нежирний бульйон без солі, перший злити, ним розвести пюре. До того - овочевий відвар."
  kompot: "Не потрібен: до року пити дають воду, грудне молоко або суміш."
  sik: "До 12 місяців не давати."
  chai: "До 12 місяців не давати: пити дають воду, грудне молоко або суміш."
  pryanoshch: "Дрібка кориці, ванілі чи солодкої паприки в пюре чи кашу. Гостре і суміші з сіллю не додавати."
  smuzi: "До 9 місяців краще пюре ложкою. Потім густе смузі без цукру ложкою чи з відкритої чашки."
  shokolad: "Не давати."
  solodoshch: "Не давати."
  gazovana: "Не давати."
  kava: "Не давати."
  sneky: "Не давати."
  ghi: "Додати пів ч. л. у готове пюре чи кашу. Почати з невеликої кількості."
